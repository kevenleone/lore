[package]
name = "lore"
version = "1.8.1" # x-release-please-version
description = "Lore — offline-first knowledge base with quick capture"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lore_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
tokio = { version = "1", features = ["time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2"

# Reached for three things: the menu bar's monospaced-digit font, which
# `tray-icon` gives no way to set (`focus_tray::use_monospaced_digits`), putting
# a deleted vault in the Trash rather than shredding it
# (`commands::trash_path`), and printing a webview to a PDF file
# (`print_pdf::export_pdf`). Every version here is the one wry already resolves,
# so the webview handed over by `with_webview` is the same `WKWebView` type.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSFont",
    "NSGraphics",
    "NSPrintInfo",
    "NSPrintOperation",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-web-kit = { version = "0.3", features = [
    "WKWebView",
    "WKPDFConfiguration",
    "block2",
] }
block2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSData",
    "NSDictionary",
    "NSError",
    "NSGeometry",
    "NSFileManager",
    "NSString",
    "NSURL",
] }
