<!--
  Lore menu-bar icon — `Lore Identity.dc.html` § 02: "Monochrome template, 18px.
  Auto-inverts."

  Drawn in solid black on transparency so macOS can treat it as a template image
  (see `icon_as_template(true)` in commands.rs) and invert it for light and dark
  menu bars.

  The ring is stroked at 4.2 rather than the master's 3 because
  `Lore App Icons.dc.html` steps the weight up as the tile shrinks (3 at 40px,
  4 at 28px, 5.4 at 18px) — the master's hairline disappears in the menu bar.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <g transform="translate(-2.785, -2.522) scale(0.587)">
    <path d="M32 9a23 23 0 1 1-19 10"
          fill="none" stroke="#000000" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M13 19C21 19 27 14 28 6 20 6 14 11 13 19Z" fill="#000000"/>
    <path d="M25.2 22 H33.2 V23.5 H31.5 V39.2 H36.9 V37.1 H38.8 V42 H26.6 L27.1 23.5 H25.2 Z"
          fill="#000000"/>
  </g>
</svg>
