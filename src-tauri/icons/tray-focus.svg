<!--
  Menu-bar icon for a running focus session — the stopwatch from the timer chip
  in `Lore Settings.dc.html` frame 1e, so the menu bar says at a glance that a
  session is going without reading the countdown beside it.

  Same rules as `tray-icon.svg`: solid black on transparency, so macOS treats it
  as a template image and inverts it for light and dark menu bars.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <g fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="18.4" r="10.4"/>
    <path d="M16 12.4 v6 l3.6 2.7"/>
    <path d="M12 2.6 h8"/>
    <path d="M16 2.6 v3.6"/>
  </g>
</svg>
